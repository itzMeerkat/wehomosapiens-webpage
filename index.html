<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WEHOMOSAPIENS</title>
  <!-- Spectral（英文衬线，SIL OFL）+ Noto Serif SC（中文衬线，SIL OFL），均可免费商用 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;700;800&family=Noto+Serif+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- 全站星空底层（JS 生成随机星点） -->
  <div class="stars" aria-hidden="true"></div>

  <!-- 导航栏 -->
  <header class="nav" id="nav">
    <a class="nav__logo" href="#top" data-bind="company.name"></a>
    <nav class="nav__links" id="nav-links"></nav>
  </header>

  <!-- 第一屏：Hero -->
  <section class="hero" id="top">
    <div class="hero__frame">
      <p class="hero__subtitle" data-bind="hero.subtitle"></p>
      <h1 class="hero__title" id="hero-title"></h1>
      <div class="hero__rule" aria-hidden="true"></div>
      <p class="hero__tagline" data-bind="company.tagline"></p>
    </div>

    <!-- 星空底层（JS 生成随机星点） -->
    <div class="hero__stars" aria-hidden="true"></div>

    <!-- 昴星团（Pleiades）：按真实方位绘制——Alcyone 居中，
         Atlas/Pleione 双星在东北（左上），
         Maia–Taygeta–Celaeno–Electra 向西（右）成链 -->
    <svg class="hero__sky" viewBox="0 0 400 400" aria-hidden="true">
      <!-- 星群连线 -->
      <line class="sky__line" x1="200" y1="190" x2="162" y2="150" pathLength="1" style="--d:0.9s"/>
      <line class="sky__line" x1="162" y1="150" x2="172" y2="138" pathLength="1" style="--d:0.96s"/>
      <line class="sky__line" x1="200" y1="190" x2="222" y2="168" pathLength="1" style="--d:1.02s"/>
      <line class="sky__line" x1="222" y1="168" x2="240" y2="162" pathLength="1" style="--d:1.08s"/>
      <line class="sky__line" x1="240" y1="162" x2="255" y2="170" pathLength="1" style="--d:1.14s"/>
      <line class="sky__line" x1="255" y1="170" x2="252" y2="194" pathLength="1" style="--d:1.2s"/>
      <line class="sky__line" x1="200" y1="190" x2="218" y2="208" pathLength="1" style="--d:1.26s"/>
      <!-- 主星 -->
      <circle class="sky__star" cx="162" cy="150" r="3"   style="--d:1.35s"/>   <!-- Atlas -->
      <circle class="sky__star" cx="172" cy="138" r="2.4" style="--d:1.42s"/>  <!-- Pleione -->
      <circle class="sky__star" cx="222" cy="168" r="3"   style="--d:1.49s"/>  <!-- Maia -->
      <circle class="sky__star" cx="240" cy="162" r="2.8" style="--d:1.56s"/>  <!-- Taygeta -->
      <circle class="sky__star" cx="255" cy="170" r="2.2" style="--d:1.63s"/>  <!-- Celaeno -->
      <circle class="sky__star" cx="252" cy="194" r="2.6" style="--d:1.7s"/>   <!-- Electra -->
      <circle class="sky__star" cx="218" cy="208" r="2.8" style="--d:1.77s"/>  <!-- Merope -->
      <circle class="sky__star" cx="199" cy="148" r="1.7" style="--d:1.84s"/>  <!-- Asterope -->
      <!-- 暗星与散落星点 -->
      <circle class="sky__star" cx="150" cy="220" r="1.2" style="--d:2s"/>
      <circle class="sky__star" cx="260" cy="130" r="1.1" style="--d:2.06s"/>
      <circle class="sky__star" cx="180" cy="230" r="1.2" style="--d:2.12s"/>
      <circle class="sky__star" cx="290" cy="190" r="1.1" style="--d:2.18s"/>
      <circle class="sky__star" cx="130" cy="170" r="1.1" style="--d:2.24s"/>
      <circle class="sky__star" cx="230" cy="120" r="1.2" style="--d:2.3s"/>
      <circle class="sky__star" cx="210" cy="245" r="1.1" style="--d:2.36s"/>
      <circle class="sky__star" cx="300" cy="120" r="1.2" style="--d:2.42s"/>
      <!-- Alcyone：主色 + 硬边光环 -->
      <circle class="sky__ring" cx="200" cy="190" r="13"/>
      <circle class="sky__ember" cx="200" cy="190" r="7.5"/>
    </svg>
    <a class="hero__scroll-hint" href="#products" data-bind="hero.scrollHint"></a>
  </section>

  <!-- 第二屏：产品列表 -->
  <section class="products" id="products">
    <header class="products__header">
      <h2 class="products__title" data-bind="sectionTitle"></h2>
      <!-- <span class="products__count" id="products-count"></span> -->
    </header>
    <div class="biz-tabs" id="biz-tabs" role="tablist"></div>
    <div id="businesses"></div>
  </section>

  <!-- 页脚 -->
  <footer class="footer" id="contact">
    <span class="footer__label" data-bind="footer.contactLabel"></span>
    <a class="footer__email" id="footer-email" href="#"></a>
    <span class="footer__copyright" data-bind="footer.copyright"></span>
  </footer>

  <script src="content.js"></script>
  <script src="app.js"></script>
</body>
</html>
