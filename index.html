<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WEHOMOSAPIENS</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <!-- Spectral（英文衬线，SIL OFL）+ Noto Serif SC（中文衬线，SIL OFL），均可免费商用 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;700;800&family=Noto+Serif+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- 全站星空底层（JS 生成随机星点） -->
  <div class="stars" aria-hidden="true"></div>

  <!-- 导航栏 -->
  <header class="nav" id="nav">
    <a class="nav__logo" href="#top" data-bind="company.name"></a>
    <nav class="nav__links" id="nav-links"></nav>
  </header>

  <!-- 第一屏：Hero -->
  <section class="hero" id="top">
    <div class="hero__frame">
      <p class="hero__subtitle" data-bind="hero.subtitle"></p>
      <h1 class="hero__title" id="hero-title"></h1>
      <div class="hero__rule" aria-hidden="true"></div>
      <p class="hero__tagline" data-bind="company.tagline"></p>
    </div>

    <!-- 星空底层（JS 生成随机星点） -->
    <div class="hero__stars" aria-hidden="true"></div>

    <!-- 昴星团（Pleiades）：按真实方位绘制——Alcyone 居中，
         Atlas/Pleione 双星在正东（左侧，几乎同高），
         Maia–Taygeta–Celaeno–Electra 向西（右）成链，Merope 在西南 -->
    <svg class="hero__sky" viewBox="0 0 400 400" aria-hidden="true">
      <!-- 星群连线 -->
      <line class="sky__line" x1="200" y1="190" x2="158" y2="196" pathLength="1" style="--d:0.55s"/>
      <line class="sky__line" x1="158" y1="196" x2="166" y2="184" pathLength="1" style="--d:0.6s"/>
      <line class="sky__line" x1="200" y1="190" x2="222" y2="168" pathLength="1" style="--d:0.65s"/>
      <line class="sky__line" x1="222" y1="168" x2="240" y2="162" pathLength="1" style="--d:0.7s"/>
      <line class="sky__line" x1="240" y1="162" x2="255" y2="170" pathLength="1" style="--d:0.75s"/>
      <line class="sky__line" x1="255" y1="170" x2="252" y2="194" pathLength="1" style="--d:0.8s"/>
      <line class="sky__line" x1="200" y1="190" x2="218" y2="208" pathLength="1" style="--d:0.85s"/>
      <!-- 主星（大小按真实亮度排序：Alcyone > Atlas > Electra > Maia > Merope > Taygeta > Pleione > Celaeno > Asterope） -->
      <circle class="sky__star" cx="158" cy="196" r="3"   style="--d:1s"/>      <!-- Atlas -->
      <circle class="sky__star" cx="166" cy="184" r="2.3" style="--d:1.05s"/>  <!-- Pleione -->
      <circle class="sky__star" cx="222" cy="168" r="2.8" style="--d:1.1s"/>   <!-- Maia -->
      <circle class="sky__star" cx="240" cy="162" r="2.5" style="--d:1.15s"/>  <!-- Taygeta -->
      <circle class="sky__star" cx="255" cy="170" r="2.2" style="--d:1.2s"/>   <!-- Celaeno -->
      <circle class="sky__star" cx="252" cy="194" r="2.9" style="--d:1.25s"/>  <!-- Electra -->
      <circle class="sky__star" cx="218" cy="208" r="2.6" style="--d:1.3s"/>   <!-- Merope -->
      <circle class="sky__star" cx="233" cy="146" r="1.7" style="--d:1.35s"/>  <!-- Asterope -->
      <!-- 暗星与散落星点 -->
      <circle class="sky__star" cx="150" cy="220" r="1.2" style="--d:1.45s"/>
      <circle class="sky__star" cx="260" cy="130" r="1.1" style="--d:1.5s"/>
      <circle class="sky__star" cx="180" cy="230" r="1.2" style="--d:1.55s"/>
      <circle class="sky__star" cx="290" cy="190" r="1.1" style="--d:1.6s"/>
      <circle class="sky__star" cx="130" cy="170" r="1.1" style="--d:1.65s"/>
      <circle class="sky__star" cx="230" cy="120" r="1.2" style="--d:1.7s"/>
      <circle class="sky__star" cx="210" cy="245" r="1.1" style="--d:1.75s"/>
      <circle class="sky__star" cx="300" cy="120" r="1.2" style="--d:1.8s"/>
      <!-- Alcyone：主色 + 硬边光环 -->
      <circle class="sky__ring" cx="200" cy="190" r="13"/>
      <circle class="sky__ember" cx="200" cy="190" r="7.5"/>
    </svg>
    <a class="hero__scroll-hint" href="#products" data-bind="hero.scrollHint"></a>
  </section>

  <!-- 第二屏：产品列表 -->
  <section class="products" id="products">
    <header class="products__header">
      <h2 class="products__title" data-bind="sectionTitle"></h2>
      <!-- <span class="products__count" id="products-count"></span> -->
    </header>
    <div class="biz-tabs" id="biz-tabs" role="tablist"></div>
    <div id="businesses"></div>
  </section>

  <!-- 页脚 -->
  <footer class="footer" id="contact">
    <span class="footer__label" data-bind="footer.contactLabel"></span>
    <a class="footer__email" id="footer-email" href="#"></a>
    <span class="footer__copyright" data-bind="footer.copyright"></span>
  </footer>

  <script src="content.js"></script>
  <script src="app.js"></script>
</body>
</html>
